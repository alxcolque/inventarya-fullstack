# Install as /etc/nginx/sites-available/inventarya.conf after certificates exist.
# The host serves the SPA and public uploads. PHP is always executed inside
# the Docker image at /var/www/html/public/index.php.
# A certificate covering inventarya.com and *.inventarya.com is required.

map $http_upgrade $inventarya_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name inventarya.com www.inventarya.com api.inventarya.com *.inventarya.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name inventarya.com www.inventarya.com *.inventarya.com;

    ssl_certificate /etc/letsencrypt/live/inventarya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inventarya.com/privkey.pem;

    root /var/www/apps/inventarya/frontend-inv/dist;
    index index.html;
    autoindex off;

    location ^~ /storage/ {
        alias /var/www/apps/inventarya/backend-inv/storage/app/public/;
        try_files $uri =404;
        autoindex off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name api.inventarya.com;

    ssl_certificate /etc/letsencrypt/live/inventarya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inventarya.com/privkey.pem;
    client_max_body_size 32m;

    location ^~ /storage/ {
        alias /var/www/apps/inventarya/backend-inv/storage/app/public/;
        try_files $uri =404;
        autoindex off;
    }

    # Reverb: /app is WebSocket traffic; /apps is server-side broadcast API.
    location ~ ^/(app|apps)(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $inventarya_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # FastCGI passes a path inside the container. Nginx does not need to
    # execute or open this PHP file on the host.
    location / {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 65s;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_URI /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param REQUEST_SCHEME https;
        fastcgi_param HTTPS on;
        fastcgi_param GATEWAY_INTERFACE CGI/1.1;
        fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
        # Only this host bridge is trusted by Laravel; replace inbound
        # forwarded values instead of forwarding client-controlled chains.
        fastcgi_param REMOTE_ADDR 127.0.0.1;
        fastcgi_param REMOTE_PORT $remote_port;
        fastcgi_param SERVER_ADDR $server_addr;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_ORIGIN $http_origin;
        fastcgi_param HTTP_X_TENANT $http_x_tenant;
        fastcgi_param HTTP_X_TENANT_DOMAIN $http_x_tenant_domain;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PORT 443;
        fastcgi_param HTTP_PROXY "";
    }
}
